# Grafana file-provisioned alert rule.
# datasourceUid is the homelab VictoriaMetrics datasource (Settings > Data sources).
# Change it if this Grafana points at a different victoriametrics-metrics-datasource.
apiVersion: 1

groups:
  - orgId: 1
    name: ntp-server
    folder: NTP Server
    interval: 1m
    rules:
      - uid: ntppool-score-low
        title: pool.ntp.org score low
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "pool.ntp.org score for {{ $labels.host }} is below 10"
          description: "ntppool_score has been below 10 for at least 15 minutes. The server may be removed from the pool if this persists."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: afwsbh7gha9kwf
            model:
              expr: ntppool_score
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 10
              refId: C
        noDataState: NoData
        execErrState: Error
